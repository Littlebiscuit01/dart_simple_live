name: app-build-action-dev

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 速度优化 1：缓存 Dart/Pub 依赖
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            simple_live_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('simple_live_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 速度优化 2：缓存 Gradle 原生依赖（避免重复下载 libmpv jar 等核心文件）
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 关键步骤：伪造签名文件
      - name: Create Mock key.properties
        run: |
          mkdir -p simple_live_app/android
          echo "storeFile=keystore.jks" > simple_live_app/android/key.properties
          echo "storePassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyPassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyAlias=mock_alias" >> simple_live_app/android/key.properties

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 核心构建：同时注入 Java 17 与 Kotlin JVM 17 参数，跳过校验，仅打 arm64 架构
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release \
            --target-platform android-arm64 \
            --android-skip-build-dependency-validation \
            -Pandroid.jvmTarget=17 \
            -Pkotlin.compiler.jvmTarget=17

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
