name: app-build-action-dev

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 关键步骤：生成伪造的 key.properties 解决 null 类型强转报错
      - name: Create Mock key.properties
        run: |
          mkdir -p simple_live_app/android
          echo "storeFile=keystore.jks" > simple_live_app/android/key.properties
          echo "storePassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyPassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyAlias=mock_alias" >> simple_live_app/android/key.properties

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
