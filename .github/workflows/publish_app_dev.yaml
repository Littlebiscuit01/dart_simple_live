name: app-build-action-dev

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 开启 Pub 依赖项缓存
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            simple_live_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('simple_live_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 1. 生成伪造的 key.properties 解决签名空指针报错
      - name: Create Mock key.properties
        run: |
          mkdir -p simple_live_app/android
          echo "storeFile=keystore.jks" > simple_live_app/android/key.properties
          echo "storePassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyPassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyAlias=mock_alias" >> simple_live_app/android/key.properties

      # 2. 稳妥修复：直接修改 gradle.properties 统一 Kotlin/Java JVM 版本
      - name: Configure Gradle Properties
        run: |
          echo "kotlin.compiler.jvmTarget=17" >> simple_live_app/android/gradle.properties
          echo "android.jvmTarget=17" >> simple_live_app/android/gradle.properties

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 3. 干净的编译指令
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
