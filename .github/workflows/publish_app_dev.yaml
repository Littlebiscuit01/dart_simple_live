name: app-build-action-dev

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. 缓存 Pub 依赖
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            simple_live_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('simple_live_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 2. 缓存 Gradle 依赖包 (加速 libmpv 等大文件复用)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 3. 注入签名 Mock + 忽略 Kotlin JVM 目标校验
      - name: Prepare Build Environment
        run: |
          mkdir -p simple_live_app/android
          echo "storeFile=keystore.jks" > simple_live_app/android/key.properties
          echo "storePassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyPassword=mock_password" >> simple_live_app/android/key.properties
          echo "keyAlias=mock_alias" >> simple_live_app/android/key.properties
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> simple_live_app/android/gradle.properties

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 4. 干净的编译指令
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
